stages:
  - security

sast-sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    # --- Tests réseau temporaires (à supprimer une fois le problème réglé) ---
    - echo "Test reseau"
    - getent hosts sonarqube-container || echo "DNS_KO"
    - bash -c 'exec 3<>/dev/tcp/sonarqube-container/9000 && printf "GET /api/system/status HTTP/1.0\r\n\r\n" >&3 && head -n 12 <&3' || echo "TCP_KO"
    # --- Analyse (mode détaillé -X temporaire) ---
    - >
      sonar-scanner -X
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=vulnerable_flask_app
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

sca-pip-audit:
  stage: security
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r vulnerable_flask_app/requirements.txt