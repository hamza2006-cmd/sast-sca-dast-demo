stages:
  - security

sast-sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    # --- Tests réseau temporaires (à supprimer une fois le problème réglé) ---
    - echo "Test reseau"
    - wget -qO- -T 10 http://sonarqube-container:9000/api/system/status || echo "INJOIGNABLE"
    - wget -qO- -T 10 "$SONAR_HOST_URL/api/system/status" || echo "VARIABLE_INJOIGNABLE"
    # --- Analyse ---
    - >
      sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=vulnerable_flask_app
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

sca-pip-audit:
  stage: security
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r vulnerable_flask_app/requirements.txt