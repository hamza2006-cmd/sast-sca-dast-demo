stages:
  - security

sast-sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    # --- Diagnostics temporaires (à supprimer ensuite) ---
    - cat /etc/resolv.conf
    - hostname -i || true
    - getent hosts sonarqube-container || echo "DNS_KO"
    - bash -c 'exec 3<>/dev/tcp/10.0.2.15/9000 && echo PORT_HOTE_OK' || echo PORT_HOTE_KO
    # --- Analyse ---
    - >
      sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=vulnerable_flask_app
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

sca-pip-audit:
  stage: security
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r vulnerable_flask_app/requirements.txt